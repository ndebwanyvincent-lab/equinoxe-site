<style>
:root{
  --band:#111014; --card:#1d1c21; --card2:#25242a; --line:#2c2b31; --ink:#f3f1f5; --muted:#a9a6ae;
  --gold:#c9a24a; --gold-soft:#e8d39b; --danger:#d0423a; --ok:#3fa36b;
  --display:"Cormorant Garamond",Georgia,serif; --body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--band);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;color:#fff;letter-spacing:.5px;line-height:1;text-decoration:none}
.logo span{color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;font-size:14.5px;font-weight:500;text-decoration:none}
.btn.out{border:1.5px solid var(--gold);color:var(--gold)}
.btn.full{background:var(--gold);color:#16151a}
.btn.ghost{border:1px solid #3a3840;color:#d9d6de}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--gold) 55%,#7a5a1c);flex:none}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(201,162,74,.22)}}}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:var(--band);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px}
.burger{width:40px;height:40px;display:grid;place-items:center;color:#fff;flex:none}
.grace{display:flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--ink);min-width:0}
.gtxt{display:flex;flex-direction:column;line-height:1.1;text-align:left;min-width:0}.gtxt b{font-size:12px;font-weight:500;white-space:nowrap}.gtxt small{font-size:10px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid #3a3840;color:#d9d6de;font-size:12.5px}
.tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#16151a;font-weight:500}

/* Carte */
main{padding-bottom:32px}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;line-height:1.35;font-weight:500;margin:0;text-wrap:balance}
.car{position:relative;width:70%;max-width:280px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:4/5;background:#0d0c10}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.slide.fit img{object-fit:contain}
.ph{width:100%;height:100%;display:grid;place-items:center;padding:20px;text-align:center;font-family:var(--display);font-style:italic;font-size:26px;color:var(--gold);background:radial-gradient(circle at 50% 30%,#2a261d,#121115)}
.pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#16151a;border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.arr{position:absolute;top:calc(50% - 26px);width:30px;height:30px;border-radius:50%;background:var(--gold);color:#16151a;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.arr.next{right:-15px}.arr.prev{left:-15px}
@media (prefers-reduced-motion:no-preference){.arr.next{animation:nudge 1.4s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}}
.cap{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}

.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold);width:18px;border-radius:4px}
.list{display:flex;flex-direction:column;border-bottom:1px solid var(--line);margin-inline:-6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
.item:nth-child(odd){background:var(--card2)}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;background:#2a261d;border:1px solid var(--line)}
.name{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.ico.go{color:var(--gold)}
.btns{display:flex;flex-direction:column;gap:8px}
.contact{color:#cfccd4;font-size:12px;text-align:center;padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.contact b{color:#fff;font-size:15px;font-weight:500;user-select:all}
.copy{border:1px solid #3a3840;border-radius:999px;padding:4px 12px;font-size:12px;color:#d9d6de}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* Plein écran (menu, aperçu) */
.screen{position:fixed;inset:0;z-index:30;background:var(--band);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.menulist{display:flex;flex-direction:column;padding-block:8px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:16px;text-align:left;width:100%}
.mi.on{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:16px}
.tile{display:block;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:#222;text-decoration:none;color:#fff}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;font-size:13px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:left}

/* Appel Grâce */
.call{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 32%,#2b2416 0%,#121115 55%,#0b0a0d 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(36px + env(safe-area-inset-bottom,0px));text-align:center}
.call-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.call-top small{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.call-top h2{margin:0;font-family:var(--display);font-style:italic;font-size:40px;font-weight:600;color:#fff}
.call-top p{margin:0;color:var(--gold-soft);font-size:15px}
.bigorb{position:relative;width:170px;height:170px;display:grid;place-items:center}
.bigorb .core{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--gold) 55%,#6e5018);box-shadow:0 0 60px rgba(201,162,74,.35);transition:transform .25s}
.bigorb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(201,162,74,.35)}
@media (prefers-reduced-motion:no-preference){
  .bigorb .ring{animation:ring 2.4s ease-out infinite}.bigorb .ring.r2{animation-delay:1.2s}
  @keyframes ring{from{transform:scale(.75);opacity:1}to{transform:scale(1.35);opacity:0}}
  .speaking .core{animation:talk .5s ease-in-out infinite alternate}@keyframes talk{to{transform:scale(1.08)}}
}
.call-actions{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:320px}
.answer{width:100%;height:56px;border-radius:999px;background:var(--gold);color:#16151a;font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}
.later{color:var(--muted);font-size:14px;padding:6px}
.incall-btns{display:flex;justify-content:center;gap:28px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cbtn i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#2a2930;color:#fff}
.cbtn.hang i{background:var(--danger)}
.cbtn.on i{background:#fff;color:#16151a}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.err{color:#f0b3ae;font-size:14px;line-height:1.5;max-width:320px}
.bubble{position:fixed;z-index:35;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bubble .orb{width:34px;height:34px}
.bubble span{font-size:13px}

/* Admin */
.panel{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field textarea{background:#141317;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.sec{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--card2)}
.sec .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sec .nm b{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .nm small{color:var(--muted);font-size:12px}
.mini{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#141317;border:1px solid var(--line);color:#d9d6de;flex:none}
.mini.del{color:#f0b3ae}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#3a3840;color:#d9d6de}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#16151a;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.bar{height:6px;border-radius:3px;background:#141317;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.confirm{background:#2a1a19;border:1px solid #5a2b28;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.prev{width:100%;max-width:220px;aspect-ratio:4/5;border-radius:12px;object-fit:cover;background:#0d0c10}
.switch{display:flex;align-items:center;gap:10px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--gold)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

</style>
</head>

async function loadAll() {
  const [s, i, st] = await Promise.all([
    supabase.from("sections").select("*").order("position"),
    supabase.from("items").select("*").order("position"),
    supabase.from("settings").select("*").eq("id", 1).maybeSingle(),
  ]);
  if (s.error || i.error) throw s.error || i.error;
  sections = s.data || []; items = i.data || []; if (st.data) settings = st.data;
}
const itemsOf = (sid) => items.filter((x) => x.section_id === sid).sort((a, b) => a.position - b.position);

async function swap(table, list, idx, dir) {
  const a = list[idx], b = list[idx + dir]; if (!a || !b) return;
  const pa = a.position, pb = b.position === pa ? pa + dir : b.position;
  const r1 = await supabase.from(table).update({ position: pb }).eq("id", a.id);
  const r2 = await supabase.from(table).update({ position: pa }).eq("id", b.id);
  if (r1.error || r2.error) return fail(r1.error || r2.error, "Déplacement");
  await refresh();
}

async function refresh() { try { await loadAll(); } catch (e) { return fail(e, "Chargement"); } render(); }

/* ---------- Envoi de fichiers (avec progression) ---------- */
function uploadFile(file, onProgress) {
  return new Promise((resolve, reject) => {
    const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/media/${path}`);
    xhr.setRequestHeader("Authorization", "Bearer " + session.access_token);
    xhr.setRequestHeader("apikey", SUPABASE_KEY);
    xhr.setRequestHeader("x-upsert", "false");
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => xhr.status < 300 ? resolve(`${SUPABASE_URL}/storage/v1/object/public/media/${path}`)
      : reject(new Error(xhr.status === 413 ? "Fichier trop lourd (50 Mo maximum)." : "Erreur " + xhr.status));
    xhr.onerror = () => reject(new Error("Connexion perdue pendant l'envoi."));
    xhr.send(file);
  });
}
async function removeStored(url) {
  const pre = `${SUPABASE_URL}/storage/v1/object/public/media/`;
  if (url && url.startsWith(pre)) await supabase.storage.from("media").remove([url.slice(pre.length)]);
}

function render() {
  renderTabs();
  const card = $("card");
  if (!cur) { card.innerHTML = '<div class="loading">Aucune rubrique pour le moment.</div>'; return; }
  const items = cur.items;
  let html = "";
  if (items.length) {
    html += `<div class="car"><div class="track" id="track">${items.map(slideHtml).join("")}</div>
      <button class="arr prev" id="prev" aria-label="Modèle précédent" hidden>${CHEV_L}</button>
      <button class="arr next" id="next" aria-label="Modèle suivant" ${items.length < 2 ? "hidden" : ""}>${CHEV_R}</button>
      <div class="cap"><b id="capName">${esc(items[0].name)}</b><span class="dots" id="dots">${items.length > 1 ? items.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("") : ""}</span></div></div>`;
  }
  html += `<h1>${esc(cur.title || cur.name)}</h1>`;
  if (items.length) {
    html += `<div class="list">${items.map((it, i) => `<div class="item">
      ${thumbOf(it) ? `<img class="thumb" src="${esc(thumbOf(it))}" alt="" loading="lazy">` : '<span class="thumb"></span>'}
      <div class="name">${esc(it.name)}</div>
      ${it.link_url ? `<a class="ico" aria-label="Voir ${esc(it.name)}" target="_blank" rel="noopener" href="${esc(it.link_url)}">${ICON_EYE}</a>`
                    : `<button class="ico" aria-label="Voir ${esc(it.name)}" data-i="${i}">${ICON_EYE}</button>`}
      <a class="ico go" aria-label="Commander ${esc(it.name)}" target="_blank" rel="noopener" href="${waLink(settings.whatsapp_number, orderMsg(it))}">${ICON_DL}</a>
    </div>`).join("")}</div>`;
  }
  html += `<div class="btns">
    ${items.length ? `<button class="btn out" id="openGrid">${ICON_EYE}Ouvrir</button>` : ""}
    <a class="btn full" target="_blank" rel="noopener" href="${waLink(settings.whatsapp_number, infoMsg())}">Commander sur WhatsApp</a></div>`;
  card.innerHTML = html;
  card.querySelectorAll("button.ico").forEach((b) => b.onclick = () => showSlide(+b.dataset.i));
  $("openGrid") && ($("openGrid").onclick = openGrid);
  wireCarousel();
}

function wireCarousel() {
  const tr = $("track"); if (!tr) return;
  const n = cur.items.length;
  const idx = () => Math.round(tr.scrollLeft / tr.clientWidth);
  $("next").onclick = () => tr.scrollBy({ left: tr.clientWidth, behavior: "smooth" });
  $("prev").onclick = () => tr.scrollBy({ left: -tr.clientWidth, behavior: "smooth" });
  const upd = () => {
    const i = Math.min(idx(), n - 1);
    $("prev").hidden = i <= 0; $("next").hidden = i >= n - 1;
    $("capName").textContent = cur.items[i].name;
    $("dots").querySelectorAll("i").forEach((d, k) => d.className = k === i ? "on" : "");
    tr.querySelectorAll("video").forEach((v, k) => { if (k !== i && !v.paused) v.pause(); });
  };
  tr.addEventListener("scroll", () => requestAnimationFrame(upd), { passive: true });
  tr.querySelectorAll("video").forEach((v) => v.addEventListener("play", () =>
    tr.querySelectorAll("video").forEach((o) => { if (o !== v) o.pause(); })));
}

function showSlide(i) {
  closeScreens();
  const tr = $("track"); if (!tr) return;
  $("card").scrollIntoView({ behavior: "smooth", block: "start" });
  const slide = tr.children[i];
  tr.scrollTo({ left: i * tr.clientWidth, behavior: "smooth" });
  const v = slide?.querySelector("video");
  if (v) setTimeout(() => v.play().catch(() => {}), 450);
}

function openGrid() {
  $("gTitle").textContent = cur.name;
  $("grid").innerHTML = cur.items.map((it, i) => {
    const img = thumbOf(it) ? `<img src="${esc(thumbOf(it))}" alt="" loading="lazy">` : `<div class="ph" style="font-size:18px">${esc(it.name)}</div>`;
    return it.link_url
      ? `<a class="tile" href="${esc(it.link_url)}" target="_blank" rel="noopener">${img}<span>${esc(it.name)}</span></a>`
      : `<button class="tile" data-i="${i}">${img}<span>${esc(it.name)}</span></button>`;
  }).join("");
  $("grid").querySelectorAll("button.tile").forEach((b) => b.onclick = () => showSlide(+b.dataset.i));
  $("gridView").hidden = false;
}

function openMenu() {
  $("menulist").innerHTML = sections.map((s) =>
    `<button class="mi${s === cur ? " on" : ""}" data-id="${s.id}"><span>${esc(s.name)}</span>${CHEV_R}</button>`).join("");
  $("menulist").querySelectorAll(".mi").forEach((b) => b.onclick = () => { closeScreens(); select(b.dataset.id); });
  $("menuWa").href = waLink(settings.whatsapp_number, "Bonjour ÉQUINOXE EVENTS, je souhaite des informations sur vos services.");
  $("menu").hidden = false;
}
function closeScreens() { $("menu").hidden = true; $("gridView").hidden = true; }

$("burger").onclick = openMenu;
$("menuClose").onclick = closeScreens;
$("gridClose").onclick = closeScreens;
$("copyBtn").onclick = () => {
  navigator.clipboard?.writeText(settings.whatsapp_number)
    .then(() => $("copyBtn").textContent = "Numéro copié")
    .catch(() => { const r = document.createRange(); r.selectNodeContents($("num")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeScreens(); });

/* ---------- Grâce : appel vocal dans la page ---------- */
let conv = null, state = "idle", muted = false, t0 = 0, tick = null;

function setView(v) {
  state = v;
  $("call").hidden = v === "idle" || v === "minimized";
  $("bubble").hidden = v !== "minimized";
  $("ringActions").hidden = v !== "ringing";
  $("errActions").hidden = v !== "error";
  $("inCallActions").hidden = !(v === "connecting" || v === "incall");
  $("timer").hidden = v !== "incall";
  $("callKicker").textContent = v === "ringing" ? "Appel entrant" : v === "error" ? "Appel interrompu" : "En ligne";
  if (v === "ringing") $("callStatus").textContent = "Équinoxe Events vous appelle…";
  if (v === "connecting") $("callStatus").textContent = "Connexion…";
  document.body.style.overflow = $("call").hidden ? "" : "hidden";
}

function ring() { if (state === "idle") setView("ringing"); }

async function answer() {
  if (state === "connecting" || state === "incall") return;
  setView("connecting");
  try {
    // Le téléphone demande l'accès au micro (une seule fois par site).
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((t) => t.stop());
  } catch (e) {
    return fail("Pour parler avec Grâce, autorisez le micro de votre téléphone, puis appuyez sur « Réessayer ».");
  }
  try {
    // Bibliothèque officielle ElevenLabs, chargée seulement au moment de l'appel.
    const { Conversation } = await import("https://esm.sh/@elevenlabs/client");
    conv = await Conversation.startSession({
      agentId: settings.elevenlabs_agent_id,
      onConnect: () => {
        setView("incall"); t0 = Date.now();
        clearInterval(tick);
        tick = setInterval(() => {
          const s = Math.floor((Date.now() - t0) / 1000);
          $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        }, 1000);
      },
      onDisconnect: () => endUi(),
      onError: () => fail("La communication avec Grâce a été coupée. Vérifiez votre connexion internet puis réessayez."),
      onModeChange: ({ mode }) => {
        const speaking = mode === "speaking";
        $("bigorb").classList.toggle("speaking", speaking);
        if (state === "incall") $("callStatus").textContent = speaking ? "Grâce vous parle…" : "Je vous écoute…";
        $("bubble").querySelector("span:last-child").textContent = speaking ? "Grâce parle…" : "Grâce · en ligne";
      },
    });
  } catch (e) {
    fail("Grâce n'est pas joignable pour le moment. Réessayez dans un instant ou écrivez-nous sur WhatsApp.");
  }
}

function fail(msg) {
  try { conv?.endSession(); } catch (e) {}
  conv = null; clearInterval(tick);
  $("errText").textContent = msg;
  $("errWa").href = waLink(settings.whatsapp_number, "Bonjour ÉQUINOXE EVENTS, je souhaite des informations sur vos services.");
  setView("error");
}

function endUi() {
  conv = null; clearInterval(tick);
  $("bigorb").classList.remove("speaking");
  muted = false; $("muteBtn").classList.remove("on"); $("muteLbl").textContent = "Couper le micro";
  if (state !== "error") setView("idle");
}

async function hangUp() { const c = conv; conv = null; try { await c?.endSession(); } catch (e) {} endUi(); setView("idle"); }

$("answerBtn").onclick = (e) => { e.stopPropagation(); answer(); };
$("call").addEventListener("click", (e) => {
  // Toucher n'importe où pendant la sonnerie = répondre
  if (state === "ringing" && !e.target.closest("#laterBtn")) answer();
});
$("laterBtn").onclick = (e) => { e.stopPropagation(); setView("idle"); };
$("retryBtn").onclick = () => answer();
$("errClose").onclick = () => setView("idle");
$("hangBtn").onclick = hangUp;
$("minBtn").onclick = () => setView("minimized");
$("bubble").onclick = () => setView(conv ? "incall" : "idle");
$("muteBtn").onclick = () => {
  if (!conv || typeof conv.setMicMuted !== "function") return;
  muted = !muted; conv.setMicMuted(muted);
  $("muteBtn").classList.toggle("on", muted);
  $("muteLbl").textContent = muted ? "Réactiver le micro" : "Couper le micro";
};
const startCall = () => { closeScreens(); if (conv) setView("incall"); else { setView("ringing"); answer(); } };
$("graceBtn").onclick = startCall;
$("menuGrace").onclick = startCall;
window.addEventListener("pagehide", () => { try { conv?.endSession(); } catch (e) {} });

/* ---------- Démarrage ---------- */
load();
let rang = false; try { rang = sessionStorage.getItem("eq-rang") === "1"; } catch (e) {}
if (!rang) {
  setTimeout(() => { ring(); try { sessionStorage.setItem("eq-rang", "1"); } catch (e) {} }, 900);
}

})(); }

</script>
